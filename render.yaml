services:
  - type: web
    name: telegram-video-bot
    runtime: node
    rootDir: bot
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: MAX_VIDEO_MB
        value: "20"
